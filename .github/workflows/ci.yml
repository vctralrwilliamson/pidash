name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python lint and security rules (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Shell scripts (shellcheck)
        run: shellcheck install.sh tests/smoke_test.sh tests/fakebin/*

      - name: Config is valid JSON
        run: python3 -m json.tool config.json > /dev/null

      - name: Dashboard JavaScript compiles
        run: |
          sed -n '/<script>/,/<\/script>/p' static/index.html | sed '1d;$d' > /tmp/page.js
          node --check /tmp/page.js

  test:
    name: Smoke test (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches Raspberry Pi OS (Debian 13); 3.11 matches Debian 12
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python -m py_compile monitor.py briefing.py

      - name: Run smoke test (fake network tools, no real scanning)
        run: bash tests/smoke_test.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL security analysis
    # CodeQL is free for public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript

      - uses: github/codeql-action/analyze@v3

  release:
    name: Publish release
    # Runs only when you push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build install bundle
        run: |
          name="pidash-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp -r monitor.py briefing.py config.json install.sh static README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "PiDash $GITHUB_REF_NAME" --generate-notes
